name: daily-rebuild
# Whether an event counts as upcoming or past is decided when the site is built, so the site must be rebuilt at least
# once a day once real events exist. This asks the host to rebuild by calling its "deploy hook".
# Setup: in the host (Netlify, Cloudflare Pages, Vercel) create a deploy hook, then in GitHub add a repository secret
# named DEPLOY_HOOK_URL with that address. Until the secret exists this workflow does nothing and says so.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the host to rebuild
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DEPLOY_HOOK_URL is not set, so no rebuild was requested. See docs/14-launch-runbook.md."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Rebuild requested."
