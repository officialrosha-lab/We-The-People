name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Mobile Lighthouse on key pages: every score 95 or more, LCP under 2.5 s, CLS under 0.1.
      - name: Lighthouse
        run: |
          npm run build
          npm run preview -- --port 4321 --ignore-lock &
          npx wait-on http://localhost:4321 --timeout 30000
          npm run lighthouse
  # Firefox and a WebKit (Safari) engine. Not blocking yet: these have not been run by the author.
  cross-browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          CROSS_BROWSER: '1'
